<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Registration</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1b1b1b;
      --muted: #666666;
      --brand: #06c755;
      --brand-disabled: #9fdfb9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --text: #f1f1f1;
        --muted: #a9a9a9;
        --brand-disabled: #2f6b47;
      }
    }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif; line-height: 1.6; }
    main { max-width: 480px; margin: 0 auto; padding: 32px 20px; box-sizing: border-box; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    #hello { font-size: 1.1rem; margin: 0 0 24px; min-height: 1.6em; }
    .btn {
      display: block; text-align: center; padding: 14px 20px; border-radius: 10px;
      background: var(--brand); color: #fff; text-decoration: none; font-size: 1.05rem; font-weight: 600;
    }
    .btn[aria-disabled="true"] { background: var(--brand-disabled); pointer-events: none; }
    .note { color: var(--muted); font-size: 0.85rem; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>ลงทะเบียนร้านค้า</h1>
    <p class="sub">Store Registration</p>

    <p id="hello">กำลังโหลด... / Loading...</p>

    <a id="go" class="btn" href="#" aria-disabled="true">เริ่มลงทะเบียน / Start registration</a>

    <p class="note">
      เราเก็บชื่อและรหัสบัญชี LINE ของคุณเพื่อใช้ติดต่อและอัปเดตข้อมูลร้านค้าเท่านั้น<br>
      We collect your LINE name and ID only to contact you and update your store information.
    </p>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    var LIFF_ID = '2012401306-9qDbo6dQ';
    var FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLSc20IdkR4gEM2np_vLYv2qmkr3MjBz3n4nRxCZq7H3h2SMMeA/viewform';
    var ENTRY_USERID = 'entry.1713870780';  // LINE userId
    var ENTRY_NAME = 'entry.1630540623';    // LINE Display Name

    var done = false;
    var helloEl = document.getElementById('hello');
    var goEl = document.getElementById('go');

    function buildUrl(p) {
      var u = FORM_BASE + '?usp=pp_url';
      if (p && p.userId && p.displayName) {
        u += '&' + ENTRY_USERID + '=' + encodeURIComponent(p.userId);
        u += '&' + ENTRY_NAME + '=' + encodeURIComponent(p.displayName);
      }
      return u;
    }

    function ready(p) {
      if (done) return;
      done = true;
      if (p && p.displayName) {
        helloEl.textContent = 'สวัสดีคุณ ' + p.displayName + ' / Hello ' + p.displayName;
      } else {
        helloEl.textContent = 'สวัสดี / Hello';
      }
      goEl.href = buildUrl(p);
      goEl.setAttribute('aria-disabled', 'false');
    }

    // ถ้า LIFF ช้าหรือผิดพลาด ให้ใช้งานต่อได้โดยไม่เติมชื่อ (ไม่บังคับล็อกอิน)
    setTimeout(function () { ready(null); }, 6000);

    try {
      liff.init({ liffId: LIFF_ID })
        .then(function () {
          if (liff.isLoggedIn()) { return liff.getProfile(); }
          return null;
        })
        .then(function (p) { ready(p); })
        .catch(function () { ready(null); });
    } catch (e) {
      ready(null);
    }
  </script>
</body>
</html>
